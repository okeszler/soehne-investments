name = "soehne-investment-cron"
main = "index.js"
compatibility_date = "2026-07-01"

# Zinsgutschrift: läuft täglich um 23:00 UTC an den möglichen Monatsletzten (28.-31.).
# Der Handler prüft selbst, ob der Folgetag der 1. ist (= heute ist der echte Monatsletzte).
# Automatische Buchungen (z.B. Taschengeld) + Kontoauszug-Mail: läuft am 1. jeden Monats um 06:00 UTC.
# (Kein eigener 4. Cron-Trigger dafür — der Cloudflare-Free-Plan erlaubt nur 5 Cron-Trigger
# pro ACCOUNT, nicht pro Worker, und das Limit war bereits ausgeschöpft.)
# Investitionen (Zinsperioden + Fälligkeit): läuft täglich um 22:00 UTC.
[triggers]
crons = ["0 23 28-31 * *", "0 6 1 * *", "0 22 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "soehne-investment"
database_id = "924c6355-a172-4b75-a8d0-6358369d7bf8"
