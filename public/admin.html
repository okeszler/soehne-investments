<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verwaltung — Söhne-Kapital</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2A3132">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="login-eyebrow">Verwaltung</div>
    <h1 class="login-title">Admin-Zugang</h1>
    <form id="login-form">
      <input id="pin-input" class="pin-input" type="password" inputmode="numeric" placeholder="••••" autocomplete="off" autofocus>
      <button type="submit" class="pin-submit">Einloggen</button>
    </form>
    <div id="login-error" class="login-error"></div>
  </div>
</div>

<div id="admin-dashboard" class="admin-shell" style="display:none;">
  <div class="app-header">
    <div>
      <div class="greeting">Verwaltung</div>
      <div class="subtitle">Buchungen erfassen</div>
    </div>
    <button class="logout-link" id="logout-btn">Abmelden</button>
  </div>

  <div class="son-picker" id="son-picker"></div>

  <div class="section">
    <div class="section-title">Neue Buchung</div>
    <form class="admin-form" id="tx-form">
      <input type="date" id="tx-date" required>
      <select id="tx-type" required>
        <option value="deposit">Einzahlung</option>
        <option value="withdrawal">Auszahlung</option>
        <option value="interest">Zinsgutschrift</option>
      </select>
      <input type="number" id="tx-amount" step="0.01" min="0" placeholder="Betrag in €" required>
      <input type="text" id="tx-note" placeholder="Notiz (optional)">
      <button type="submit" class="admin-submit">Buchung speichern</button>
    </form>
  </div>

  <div class="section">
    <div class="section-title">Jahreszins für Hochrechnung</div>
    <form class="admin-form" id="rate-form">
      <input type="number" id="rate-input" step="0.01" min="0" max="100" placeholder="z.B. 3 für 3%">
      <button type="submit" class="admin-submit" style="grid-column:1/-1;">Zins speichern</button>
    </form>
  </div>

  <div class="section">
    <div class="section-title">Automatische Buchung am 1. des Monats</div>
    <form class="admin-form" id="recurring-form">
      <select id="recurring-type" required>
        <option value="deposit">Einzahlung</option>
        <option value="withdrawal">Auszahlung</option>
        <option value="interest">Zinsgutschrift</option>
      </select>
      <input type="number" id="recurring-amount" step="0.01" min="0" placeholder="Betrag in €" required>
      <input type="text" id="recurring-note" class="full" placeholder="Notiz (z.B. Taschengeld)">
      <button type="submit" class="admin-submit">Automatische Buchung anlegen</button>
    </form>
    <table class="ledger-table" id="recurring-table">
      <thead><tr><th>Art</th><th>Betrag</th><th>Notiz</th><th></th></tr></thead>
      <tbody id="recurring-body"></tbody>
    </table>
    <div class="empty-note" id="recurring-empty" style="display:none;">Keine automatische Buchung für diesen Sohn eingerichtet.</div>
  </div>

  <div class="section">
    <div class="section-title">Bisherige Buchungen</div>
    <table class="ledger-table" id="tx-table">
      <thead><tr><th>Datum</th><th>Art</th><th>Betrag</th><th></th></tr></thead>
      <tbody id="tx-body"></tbody>
    </table>
    <div class="empty-note" id="tx-empty" style="display:none;">Noch keine Buchungen für diesen Sohn.</div>
  </div>
</div>

<script src="/js/admin.js"></script>
</body>
</html>
